# Include this location inside the HTTPS server block for miniapp.kiani.exchange.
# It exposes only the generated JPEG directory to Meta's media fetcher.
location ^~ /instagram-rates/ {
    alias /var/lib/kiani-instagram-rates/public/;
    autoindex off;
    types { image/jpeg jpg jpeg; }
    default_type image/jpeg;
    add_header Cache-Control "public, max-age=300" always;
}

