<!DOCTYPE html>
<html>
<head>
    <title>Test Frontend Connection</title>
</head>
<body>
    <h1>Testing Frontend API Connection</h1>
    <div id="result">Loading...</div>
    
    <script>
        async function testAPI() {
            try {
                const response = await fetch('https://miniapp.peerexo.com/api/rates/current');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                document.getElementById('result').innerHTML = 
                    `<p>Success! Rates fetched:</p>
                     <pre>${JSON.stringify(data, null, 2)}</pre>
                     <p>Frontend URL: ${window.location.href}</p>`;
            } catch (error) {
                document.getElementById('result').innerHTML = 
                    `<p>Error: ${error.message}</p>
                     <p>Make sure you're accessing https://miniapp.peerexo.com</p>`;
            }
        }
        
        testAPI();
    </script>
</body>
</html>
