server {
    listen 80;
    server_name kianiapp.peerexo.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name kianiapp.peerexo.com;

    ssl_certificate     /etc/letsencrypt/live/miniapp.peerexo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/miniapp.peerexo.com/privkey.pem;

    root /home/kianirad2020/telegram_bot_repo/kiani-exchange/frontend/admin-panel/dist;
    index index.html;

    # API proxy — forwards /api/* to FastAPI backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets (hashed filenames) — cache aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html — never cache (so deploys take effect immediately)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # SPA fallback — all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
