name: AlanChande image previews

on:
  push:
    branches: [feature/alanchande-image-posts-20261025]
    paths:
      - channel_split/market_images.py
      - channel_split/market_report_templates.py
      - channel_split/market_image_assets/**
      - channel_split/test_market_image*.py
      - channel_split/test_market_report_templates.py
      - channel_split/visual_market_images.py
      - channel_split/deploy_market_images.py
      - channel_split/tgju_public_api.py
      - channel_split/prepare_tgju_api_transport.py
      - channel_split/test_tgju_public_api.py
      - channel_split/add_tgju_akamai_endpoint.py
      - channel_split/kiani_images.py
      - channel_split/kiani_image_assets/**
      - channel_split/deploy_kiani_images.py
      - channel_split/test_kiani_images.py
      - channel_split/visual_kiani_images.py
      - channel_split/*stor*.py
      - channel_split/requirements-stories.txt
      - channel_split/systemd/kiani-channel-stories.*
      - .github/workflows/alanchande-image-previews.yml
  pull_request:
    paths:
      - channel_split/**
      - .github/workflows/alanchande-image-previews.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alanchande-image-previews-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install screenshot and comparison dependencies
        run: |
          python -m pip install 'playwright==1.57.0' Pillow
          python -m pip install -r channel_split/requirements-stories.txt
          python -m playwright install --with-deps chromium
      - name: Test five templates, publisher contracts and guarded deployment
        env:
          RENDER_PNG_TESTS: '1'
        run: |
          python channel_split/test_market_images.py -v
          python channel_split/test_market_report_templates.py -v
          python channel_split/test_market_image_deploy.py -v
          python channel_split/test_market_image_delivery.py -v
          python channel_split/test_tgju_public_api.py -v
          python channel_split/add_tgju_akamai_endpoint.py --self-test
          python channel_split/test_kiani_images.py -v
          python channel_split/test_kiani_stories.py -v
          python channel_split/test_kiani_story_setup.py -v
          python -m unittest discover -s tests -p test_channel_split_market_safety.py -v
          python -m unittest discover -s tests -p test_channel_split_hybrid_usdt.py -v
          python -m unittest discover -s tests -p test_channel_split_market_pulse.py -v
          python -m unittest discover -s tests -p test_channel_split_iran_fx.py -v
          python -m unittest discover -s tests -p 'test_channel_split_*history.py' -v
          bash -n channel_split/deploy_images_via_ssh.sh
      - name: Generate all five visibly illustrative PNG proofs
        run: python channel_split/visual_market_images.py --kind all --output-dir image-previews
      - name: Generate four visibly illustrative Kiani customer images
        run: python channel_split/visual_kiani_images.py --output-dir image-previews/kiani
      - name: Upload visual-review PNGs
        uses: actions/upload-artifact@v4
        with:
          name: alanchande-five-template-previews
          path: image-previews/**/*.png
          if-no-files-found: error
          retention-days: 14
