name: Kiani rate contract

on:
  pull_request:
    paths:
      - "channel_split/publish_channels.py"
      - "channel_split/kiani_shared_pricing.py"
      - "kiani-exchange/backend/**"
      - "kiani-exchange/frontend/mini-app/src/**"
      - "kiani-exchange/frontend/mini-app/package.json"
      - "kiani-exchange/frontend/mini-app/package-lock.json"
      - "main_user_pricing_client.py"
      - "main_user_runtime.py"
      - "tests/test_main_user_shared_pricing.py"
      - ".github/workflows/kiani-rate-contract.yml"
  push:
    branches:
      - main
      - "feature/**"
      - "codex/**"
    paths:
      - "channel_split/publish_channels.py"
      - "channel_split/kiani_shared_pricing.py"
      - "kiani-exchange/backend/**"
      - "kiani-exchange/frontend/mini-app/src/**"
      - "kiani-exchange/frontend/mini-app/package.json"
      - "kiani-exchange/frontend/mini-app/package-lock.json"
      - "main_user_pricing_client.py"
      - "main_user_runtime.py"
      - "tests/test_main_user_shared_pricing.py"
      - ".github/workflows/kiani-rate-contract.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install -r kiani-exchange/backend/requirements.txt
      - name: Compile affected Python modules
        run: python -m py_compile channel_split/publish_channels.py channel_split/kiani_shared_pricing.py kiani-exchange/backend/app/api/rates.py kiani-exchange/backend/app/canonical_try_rates.py main_user_pricing_client.py main_user_runtime.py
      - name: Test canonical rates API
        working-directory: kiani-exchange/backend
        run: python -m unittest discover -s tests -p 'test_canonical_try_rates.py' -v && python -m unittest discover -s tests -p 'test_rates_api.py' -v
      - name: Test main user pricing
        run: python -m unittest tests.test_main_user_shared_pricing -v

  miniapp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kiani-exchange/frontend/mini-app/package-lock.json
      - name: Install mini-app dependencies
        working-directory: kiani-exchange/frontend/mini-app
        run: npm ci
      - name: Build mini-app
        working-directory: kiani-exchange/frontend/mini-app
        run: npm run build
