name: Kiani CI

on:
  pull_request:
    paths:
      - 'kiani-exchange/**'
      - '.github/workflows/kiani-ci.yml'
  push:
    branches:
      - 'security/**'
      - 'production/kiani-*'
    paths:
      - 'kiani-exchange/**'
      - '.github/workflows/kiani-ci.yml'

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kiani-exchange/backend
    env:
      JWT_SECRET_KEY: test-jwt-secret-key-that-is-longer-than-thirty-two-characters
      ACCESS_TOKEN_EXPIRE_HOURS: '4'
      ADMIN_ACCESS_TOKEN_EXPIRE_MINUTES: '30'
      ADMIN_PANEL_USERNAME: admin-test
      ADMIN_PANEL_PASSWORD: AdminTestPassword123
      SUPPORT_PANEL_USERNAME: support-test
      SUPPORT_PANEL_PASSWORD: SupportTestPassword123
      VIEWER_PANEL_USERNAME: viewer-test
      VIEWER_PANEL_PASSWORD: ViewerTestPassword123
      CORS_ALLOWED_ORIGINS: https://miniapp.peerexo.com,https://kianiapp.peerexo.com
      TELEGRAM_ADMIN_BOT_TOKEN: ''
      TELEGRAM_ADMIN_CHAT_ID: '0'
      TELEGRAM_USER_BOT_TOKEN: ''
      TELEGRAM_BOT_TOKEN: ''
      EHRAZ_TOKEN: test-ehraz-token
      KYC_TEST_MODE: 'false'
      ALLOW_KYC_TEST_MODE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            kiani-exchange/backend/requirements.txt
            kiani-exchange/backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile backend
        run: python -m compileall -q app tests
      - name: Run tests
        run: pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kiani-exchange/frontend/mini-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: kiani-exchange/frontend/mini-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
