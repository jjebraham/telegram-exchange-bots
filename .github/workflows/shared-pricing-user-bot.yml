name: Shared pricing user bot

on:
  pull_request:
    paths:
      - "main_user_bot_clone.py"
      - "main_user_pricing_client.py"
      - "main_user_runtime.py"
      - "tests/test_main_user_shared_pricing.py"
      - "channel_split/kiani_shared_pricing.py"
      - "channel_split/publish_channels.py"
      - "tests/test_channel_split_kiani_shared_pricing.py"
      - "kiani-exchange/frontend/mini-app/**"
      - "kiani-exchange/backend/**"
      - "tests/test_rates_api.py"
      - ".github/workflows/shared-pricing-user-bot.yml"
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "main_user_bot_clone.py"
      - "main_user_pricing_client.py"
      - "main_user_runtime.py"
      - "tests/test_main_user_shared_pricing.py"
      - "channel_split/kiani_shared_pricing.py"
      - "channel_split/publish_channels.py"
      - "tests/test_channel_split_kiani_shared_pricing.py"
      - "kiani-exchange/frontend/mini-app/**"
      - "kiani-exchange/backend/**"
      - "tests/test_rates_api.py"
      - ".github/workflows/shared-pricing-user-bot.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API test dependencies
        run: python -m pip install -r kiani-exchange/backend/requirements.txt

      - name: Syntax check
        run: python -m py_compile main_user_pricing_client.py main_user_runtime.py kiani-exchange/backend/app/canonical_try_rates.py kiani-exchange/backend/app/api/rates.py kiani-exchange/backend/tests/test_rates_api.py

      - name: Test canonical rates API
        working-directory: kiani-exchange/backend
        run: python -m unittest discover -s tests -p 'test_canonical_try_rates.py' -v && python -m unittest discover -s tests -p 'test_rates_api.py' -v

      - name: Verify and test user bot pricing
        run: python -m unittest tests.test_main_user_shared_pricing -v

      - name: Test shared channel pricing
        run: python -m unittest tests.test_channel_split_kiani_shared_pricing -v

  mini-app-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: kiani-exchange/frontend/mini-app/package-lock.json

      - name: Install mini-app dependencies
        working-directory: kiani-exchange/frontend/mini-app
        run: npm ci

      - name: Build mini app
        working-directory: kiani-exchange/frontend/mini-app
        run: npm run build
