name: Instagram economy news checks

on:
  pull_request:
    paths:
      - 'economy_news_*.py'
      - 'instagram_*news*.py'
      - 'deploy/instagram-economy/**'
      - 'tests/test_instagram*news.py'
      - '.github/workflows/instagram-economy-news.yml'
  push:
    branches:
      - 'codex/instagram-economy-news-20261009'
    paths:
      - 'economy_news_*.py'
      - 'instagram_*news*.py'
      - 'deploy/instagram-economy/**'
      - 'tests/test_instagram*news.py'
      - '.github/workflows/instagram-economy-news.yml'

permissions:
  contents: read

jobs:
  news-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check economy and shared news behavior without live APIs
        run: python -m unittest discover -s tests -p 'test_instagram*news.py' -v
